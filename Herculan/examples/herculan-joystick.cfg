[Joystick]
;; Herculan's own file. The simulator's own prefs.cfg still says what each
;; control DOES; this says which piece of hardware each control IS, which is
;; the one thing a 1996 gameport stick did not need to be told.
;;
;; Axes and buttons are zero-based indices into what the device reports.
;; -1 leaves a control unmapped, which greys its row on the CONTROLS panel.
;;
;; EXAMPLE -- a Thrustmaster T.Flight HOTAS in PC mode (NOT the PS3 position of
;; the switch on its base, which renumbers everything). Copy to the install's
;; data\ folder, beside keyjoy.cfg, and check the indices with --joystick-probe
;; before trusting them: a device's axis order is its own. [Joystick] serves any
;; joystick without a [Joystick <GUID>] section of its own; the Controller window
;; writes that section for the model it is set up with.

StickX = 0                   ;; left / right
StickY = 1                   ;; fore / aft
Throttle = 2                 ;; the lever -- often NOT axis 2 on a modern stick
Rudder = 4                   ;; the throttle's paddles, NOT the stick's twist
Hat = 0                      ;; the POV hat; only one is bindable

InvertStickX = off
InvertStickY = off
InvertThrottle = off         ;; the lever's CLOSED stop must read positive
InvertRudder = off

Deadzone = 25                ;; of 128; the original uses 25
HatDiagonals = off           ;; the original drops them; on resolves one into its two cardinals
BipolarThrottle = on         ;; on: centre of travel is idle, aft of it is reverse

;; BUTTON 1-8 as the CONTROLS panel numbers them. The format binds eight and
;; no more, so a stick with more has to leave the rest out.
Button1 = 0
Button2 = 1
Button3 = 2
Button4 = 3
Button5 = 4
Button6 = 5
Button7 = 6
Button8 = 7
